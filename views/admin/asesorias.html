<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Asesorías | Panel admin</title><link rel="stylesheet" href="/css/admin.css"><link rel="stylesheet" href="/css/logo.css"><link rel="stylesheet" href="/css/admin-asesorias.css"><link rel="icon" href="/images/aura-logo.svg" type="image/svg+xml"></head>
<body>
<header class="admin-header"><a class="admin-brand" href="/admin/dashboard.html" aria-label="Aura Makeup"><img class="logo-imagen" src="/images/aura-logo.svg" alt="Aura Makeup"></a><nav class="admin-nav" aria-label="Navegación administrativa"><a href="/admin/usuarios.html">Usuarios</a><a href="/admin/productos.html">Productos</a><a href="/admin/kits.html">Kits</a><a href="/admin/asesorias.html">Asesorías</a><a href="/admin/pedidos.html">Pedidos</a><a class="admin-logout" href="/login" id="cerrarSesion">Cerrar sesión</a></nav></header>
<main class="admin-content"><section class="asesorias-admin-intro"><div><p class="admin-kicker">Atención / acompañamiento</p><h1>Asesorías</h1></div><p>Responde las dudas de la comunidad y acompaña cada ritual de belleza.</p></section><section class="asesorias-panel"><div class="asesorias-panel-cabecera"><h2>Consultas de usuarios <span id="contador"></span></h2><select id="filtro"><option value="todas">Todas</option><option value="pendiente">Pendientes</option><option value="respondida">Respondidas</option></select></div><p id="mensaje" class="mensaje-admin"></p><div id="lista"></div></section></main>
<script>
const token=localStorage.getItem('token');const usuario=JSON.parse(localStorage.getItem('usuario')||'null');if(!token||!usuario||usuario.rol!=='admin')window.location.replace('/login');let consultas=[];const $=id=>document.getElementById(id);const escapar=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'}[c]));const fecha=v=>new Intl.DateTimeFormat('es-CO',{dateStyle:'medium',timeStyle:'short'}).format(new Date(`${v.replace(' ','T')}Z`));async function peticion(url,opciones={}){const r=await fetch(url,{...opciones,headers:{'Content-Type':'application/json',Authorization:`Bearer ${token}`,...(opciones.headers||{})}});const d=await r.json();if(!r.ok)throw new Error(d.mensaje||'No se pudo completar la operación');return d;}function pintar(){const filtro=$('filtro').value;const visibles=consultas.filter(c=>filtro==='todas'||c.estado===filtro);$('contador').textContent=`(${visibles.length})`;$('lista').innerHTML=visibles.length?visibles.map(c=>`<article class="consulta-admin"><div class="consulta-admin-meta"><div><strong>${escapar(c.usuario_nombre)}</strong><small>${escapar(c.usuario_correo)} · ${c.metodo==='chat'?'Chat':'Formulario'} · ${fecha(c.fecha_creacion)}</small></div><span class="estado-admin ${c.estado}">${c.estado==='respondida'?'Respondida':'Pendiente'}</span></div><p class="consulta-admin-pregunta">${escapar(c.pregunta)}</p>${c.estado==='respondida'?`<div class="respuesta-admin"><strong>Respuesta enviada</strong><p>${escapar(c.respuesta)}</p></div>`:`<form class="form-respuesta" data-responder="${c.id}"><textarea required minlength="5" placeholder="Escribe la orientación para el usuario..."></textarea><button class="boton-admin" type="submit">Enviar respuesta</button></form>`}</article>`).join(''):'<p class="asesorias-vacio">No hay consultas en este filtro.</p>';}async function cargar(){try{consultas=await peticion('/api/asesorias/admin');pintar();}catch(e){$('mensaje').textContent=e.message;}}$('filtro').addEventListener('change',pintar);document.addEventListener('submit',async e=>{const form=e.target.closest('[data-responder]');if(!form)return;e.preventDefault();try{await peticion(`/api/asesorias/${form.dataset.responder}/respuesta`,{method:'PATCH',body:JSON.stringify({respuesta:form.querySelector('textarea').value})});await cargar();}catch(error){$('mensaje').textContent=error.message;}});$('cerrarSesion').addEventListener('click',()=>{localStorage.removeItem('token');localStorage.removeItem('usuario');});cargar();
</script></body></html>

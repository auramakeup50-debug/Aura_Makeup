<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Kits | Panel admin</title>
	<link rel="stylesheet" href="/css/admin.css"><link rel="stylesheet" href="/css/logo.css"><link rel="icon" href="/images/aura-logo.svg" type="image/svg+xml"><link rel="stylesheet" href="/css/admin-kits.css">
</head>
<body>
	<header class="admin-header"><a class="admin-brand" href="/admin/dashboard.html" aria-label="Aura Makeup"><img class="logo-imagen" src="/images/aura-logo.svg" alt="Aura Makeup"></a><nav class="admin-nav" aria-label="Navegación administrativa"><a href="/admin/usuarios.html">Usuarios</a><a href="/admin/productos.html">Productos</a><a href="/admin/kits.html">Kits</a><a href="/admin/pedidos.html">Pedidos</a><a class="admin-logout" href="/login" id="cerrarSesion">Cerrar sesión</a></nav></header>
	<main class="admin-content"><section class="kits-admin-intro"><div><p class="admin-kicker">Catálogo / paquetes especiales</p><h1>Kits de productos</h1></div><p>Organiza rutinas completas y ofrece una selección lista para comprar.</p></section>
		<div class="kits-admin-layout"><section class="kit-form-panel"><h2 id="tituloFormulario">Crear kit</h2><form id="formKit"><input type="hidden" id="kitId"><label>Nombre<input id="nombre" required placeholder="Glow Básico"></label><label>Descripción<textarea id="descripcion" required></textarea></label><label>Precio del kit<input id="precio" type="number" min="0" required></label><label>Ruta de imagen<input id="imagen" required placeholder="/images/kits/glow-basico.png"></label><label>Productos incluidos<select id="productos" multiple required></select></label><p class="ayuda">Usa Ctrl/Cmd para seleccionar varios productos.</p><label class="check-kit"><input id="activo" type="checkbox" checked> Kit activo en la tienda</label><div class="botones-kit"><button class="boton-admin" type="submit">Guardar kit</button><button class="boton-admin secundario" id="cancelar" type="button" hidden>Cancelar</button></div><p id="mensaje" class="mensaje-admin" role="status"></p></form></section><section class="kits-lista-panel"><div class="lista-cabecera"><h2>Kits creados <span id="total"></span></h2></div><div id="listaKits"></div></section></div>
	</main>
	<script>
		const token = localStorage.getItem('token'); const usuario = JSON.parse(localStorage.getItem('usuario') || 'null'); if (!token || !usuario || usuario.rol !== 'admin') window.location.replace('/login');
		let kits = [], productos = []; const $ = (id) => document.getElementById(id); const dinero = (valor) => `$${Number(valor).toLocaleString('es-CO')}`;
		async function peticion(url, opciones = {}) { const respuesta = await fetch(url, { ...opciones, headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}`, ...(opciones.headers || {}) } }); if (respuesta.status === 401 || respuesta.status === 403) { localStorage.removeItem('token'); localStorage.removeItem('usuario'); window.location.replace('/login'); return null; } const datos = await respuesta.json(); if (!respuesta.ok) throw new Error(datos.mensaje || 'No se pudo completar la operación'); return datos; }
		function cargarSelect() { $('productos').innerHTML = productos.map((producto) => `<option value="${producto.id}">${producto.nombre} · ${dinero(producto.precio)}</option>`).join(''); }
		function pintarKits() { $('total').textContent = `(${kits.length})`; $('listaKits').innerHTML = kits.length ? kits.map((kit) => `<article class="kit-admin-card"><img src="${kit.imagen}" alt=""><div><div class="kit-admin-top"><h3>${kit.nombre}</h3><span class="estado-kit ${kit.disponible ? (kit.activo ? 'activo' : 'inactivo') : 'revisar'}">${kit.disponible ? (kit.activo ? 'Activo' : 'Inactivo') : 'Revisar productos'}</span></div><p>${kit.descripcion}</p><strong>${dinero(kit.precio)}</strong><small>${kit.incluidos.map((producto) => producto.nombre).join(' · ') || 'Hay productos que ya no existen'}</small><div class="acciones-kit"><button class="accion-tabla" data-editar="${kit.id}">Editar</button><button class="accion-tabla" data-activo="${kit.id}" data-valor="${kit.activo ? '0' : '1'}">${kit.activo ? 'Desactivar' : 'Activar'}</button></div></div></article>`).join('') : '<p class="kits-vacio">Todavía no hay kits creados.</p>'; }
		function limpiar() { $('formKit').reset(); $('kitId').value = ''; $('activo').checked = true; $('tituloFormulario').textContent = 'Crear kit'; $('cancelar').hidden = true; [...$('productos').options].forEach((opcion) => opcion.selected = false); }
		function editar(kit) { $('kitId').value = kit.id; $('nombre').value = kit.nombre; $('descripcion').value = kit.descripcion; $('precio').value = kit.precio; $('imagen').value = kit.imagen; $('activo').checked = kit.activo; [...$('productos').options].forEach((opcion) => opcion.selected = kit.productos.includes(Number(opcion.value))); $('tituloFormulario').textContent = 'Editar kit'; $('cancelar').hidden = false; window.scrollTo({ top: 0, behavior: 'smooth' }); }
		$('formKit').addEventListener('submit', async (evento) => { evento.preventDefault(); const datos = { nombre: $('nombre').value.trim(), descripcion: $('descripcion').value.trim(), precio: Number($('precio').value), imagen: $('imagen').value.trim(), activo: $('activo').checked, productos: [...$('productos').selectedOptions].map((opcion) => Number(opcion.value)) }; try { const id = $('kitId').value; await peticion(id ? `/api/kits/${id}` : '/api/kits', { method: id ? 'PUT' : 'POST', body: JSON.stringify(datos) }); $('mensaje').textContent = 'Kit guardado correctamente.'; limpiar(); kits = await peticion('/api/kits/admin'); pintarKits(); } catch (error) { $('mensaje').textContent = error.message; } });
		$('cancelar').addEventListener('click', limpiar); document.addEventListener('click', async (evento) => { const editarBoton = evento.target.closest('[data-editar]'); const estadoBoton = evento.target.closest('[data-activo]'); try { if (editarBoton) editar(kits.find((kit) => kit.id === Number(editarBoton.dataset.editar))); if (estadoBoton) { await peticion(`/api/kits/${estadoBoton.dataset.activo}/activo`, { method: 'PATCH', body: JSON.stringify({ activo: estadoBoton.dataset.valor === '1' }) }); kits = await peticion('/api/kits/admin'); pintarKits(); } } catch (error) { $('mensaje').textContent = error.message; } }); $('cerrarSesion').addEventListener('click', () => { localStorage.removeItem('token'); localStorage.removeItem('usuario'); });
		(async function iniciar() { try { [productos, kits] = await Promise.all([peticion('/api/productos'), peticion('/api/kits/admin')]); cargarSelect(); pintarKits(); } catch (error) { $('mensaje').textContent = error.message; } })();
	</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Iniciar sesión | Aura Makeup</title>
	<link rel="stylesheet" href="/css/auth.css">
</head>
<body class="pagina-auth">
	<main class="auth-shell">
		<section class="auth-visual" aria-label="Promoción de Aura Makeup">
			<div class="visual-content">
				<p class="eyebrow">Aura Makeup</p>
				<h1>Tu belleza, <span>en cada detalle.</span></h1>
				<p>Descubre productos pensados para resaltar tu brillo natural con tonos cálidos, luminosos y elegantes.</p>
			</div>
		</section>

		<section class="auth-panel">
			<div class="auth-card">
				<div class="auth-brand-row">
					<div class="brand-mark">A</div>
					<div class="brand-copy">
						<h2>Aura Makeup</h2>
						<p>Cuida tu ritual</p>
					</div>
				</div>

				<div class="auth-head">
					<p class="auth-tag">Bienvenida de vuelta</p>
					<h1>Inicia sesión</h1>
				</div>

				<form class="auth-form" id="formLogin">
					<div class="auth-field">
						<label for="correo">Correo electrónico</label>
						<input type="email" id="correo" name="correo" autocomplete="email" required>
					</div>

					<div class="auth-field">
						<label for="password">Contraseña</label>
						<input type="password" id="password" name="password" autocomplete="current-password" required>
					</div>

					<button class="auth-button" type="submit">Iniciar sesión</button>
				</form>

				<p class="auth-message" id="mensaje" aria-live="polite"></p>
				<p class="auth-switch">¿No tienes una cuenta? <a href="/registro">Crear una cuenta</a></p>
			</div>
		</section>
	</main>
	<script>
		const formulario = document.getElementById('formLogin');
		const mensaje = document.getElementById('mensaje');

		formulario.addEventListener('submit', async (event) => {
			event.preventDefault();
			mensaje.textContent = '';

			try {
				const respuesta = await fetch('/api/auth/login', {
					method: 'POST',
					headers: { 'Content-Type': 'application/json' },
					body: JSON.stringify({
						correo: document.getElementById('correo').value,
						password: document.getElementById('password').value
					})
				});
				const datos = await respuesta.json();

				if (!respuesta.ok) {
					mensaje.textContent = datos.mensaje;
					return;
				}

				localStorage.setItem('token', datos.token);
				localStorage.setItem('usuario', JSON.stringify(datos.usuario));
				window.location.href = datos.usuario.rol === 'admin'
					? '/admin/dashboard.html'
					: '/usuario/inicio.html';
			} catch (error) {
				mensaje.textContent = 'No se pudo conectar con el servidor';
			}
		});
	</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registro | Aura Makeup</title>
    <link rel="stylesheet" href="/css/auth.css">
</head>

<body class="pagina-auth">
    <main class="auth-shell register-shell">
        <section class="auth-visual register-visual" aria-label="Promoción de Aura Makeup">
            <div class="visual-content">
                <p class="eyebrow">Aura Makeup</p>
                <h1>Hazte notar <span>con tu estilo.</span></h1>
                <p>Únete a una comunidad que celebra la belleza natural, el brillo elegante y la confianza en cada detalle.</p>
            </div>
        </section>

        <section class="auth-panel">
            <div class="auth-card">
                <div class="auth-brand-row">
                    <div class="brand-mark register-mark">A</div>
                    <div class="brand-copy">
                        <h2>Aura Makeup</h2>
                        <p>Únete a la colección</p>
                    </div>
                </div>

                <div class="auth-head">
                    <p class="auth-tag">Crea tu cuenta</p>
                    <h1>Regístrate</h1>
                </div>

                <form class="auth-form" id="formRegistro">
                    <div class="auth-field">
                        <label for="nombre">Nombre</label>
                        <input type="text" id="nombre" name="nombre" autocomplete="name" required>
                    </div>

                    <div class="auth-field">
                        <label for="correo">Correo electrónico</label>
                        <input type="email" id="correo" name="correo" autocomplete="email" required>
                    </div>

                    <div class="auth-field">
                        <label for="password">Contraseña</label>
                        <input type="password" id="password" name="password" autocomplete="new-password" required>
                    </div>

                    <button class="auth-button register-button" type="submit">Registrarme</button>
                </form>

                <p class="auth-message" id="mensaje" aria-live="polite"></p>
                <p class="auth-switch">¿Ya tienes una cuenta? <a href="/login">Inicia sesión</a></p>
            </div>
        </section>
    </main>

    <script>

        const formulario = document.getElementById('formRegistro');

        formulario.addEventListener('submit', async (event) => {

            event.preventDefault();

            const nombre = document.getElementById('nombre').value;
            const correo = document.getElementById('correo').value;
            const password = document.getElementById('password').value;

            try {

                const respuesta = await fetch(
                    '/api/auth/registro',
                    {
                        method: 'POST',

                        headers: {
                            'Content-Type': 'application/json'
                        },

                        body: JSON.stringify({
                            nombre,
                            correo,
                            password
                        })
                    }
                );

                const datos = await respuesta.json();

                document.getElementById('mensaje').textContent =
                    datos.mensaje;

                if (respuesta.ok) {

                    formulario.reset();

                }

            } catch (error) {

                console.error(error);

                document.getElementById('mensaje').textContent =
                    'No se pudo conectar con el servidor';

            }

        });

    </script>

</body>

</html>

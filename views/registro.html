<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registro | Aura Makeup</title>
    <link rel="stylesheet" href="/css/auth.css">
</head>

<body class="pagina-auth">

    <main class="auth-card">
        <h1 class="auth-brand">Aura Makeup</h1>

        <p class="auth-subtitle">Crea tu cuenta y descubre tu estilo.</p>

        <form class="auth-form" id="formRegistro">

            <div class="auth-field">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" name="nombre" autocomplete="name" required>
            </div>

            <div class="auth-field">
                <label for="correo">Correo electrónico</label>
                <input type="email" id="correo" name="correo" autocomplete="email" required>
            </div>

            <div class="auth-field">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" autocomplete="new-password" required>
            </div>

            <button class="auth-button" type="submit">Registrarme</button>
        </form>

        <p class="auth-message" id="mensaje" aria-live="polite"></p>
        <p class="auth-switch">¿Ya tienes una cuenta? <a href="/login">Inicia sesión</a></p>
    </main>



    <script>

        const formulario = document.getElementById('formRegistro');

        formulario.addEventListener('submit', async (event) => {

            event.preventDefault();

            const nombre = document.getElementById('nombre').value;
            const correo = document.getElementById('correo').value;
            const password = document.getElementById('password').value;

            try {

                const respuesta = await fetch(
                    '/api/auth/registro',
                    {
                        method: 'POST',

                        headers: {
                            'Content-Type': 'application/json'
                        },

                        body: JSON.stringify({
                            nombre,
                            correo,
                            password
                        })
                    }
                );

                const datos = await respuesta.json();

                document.getElementById('mensaje').textContent =
                    datos.mensaje;

                if (respuesta.ok) {

                    formulario.reset();

                }

            } catch (error) {

                console.error(error);

                document.getElementById('mensaje').textContent =
                    'No se pudo conectar con el servidor';

            }

        });

    </script>

</body>

</html>

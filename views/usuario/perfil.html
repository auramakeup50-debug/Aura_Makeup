<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mi perfil | Aura Makeup</title>

    <link rel="stylesheet" href="/css/usuario.css">
</head>

<body>

    <header class="usuario-header">

        <a class="marca" href="/usuario/inicio.html">
            Aura Makeup
        </a>

        <nav class="usuario-nav">

            <a href="/usuario/inicio.html">
                Inicio
            </a>

            <a href="/usuario/historial.html">
                Mis pedidos
            </a>

            <a href="/usuario/carrito.html">
                Mi carrito
            </a>

            <a href="/login" id="cerrarSesion">
                Cerrar sesión
            </a>

        </nav>

    </header>


    <main class="usuario-contenido">

        <section class="usuario-hero">

            <p class="usuario-etiqueta">
                Mi cuenta
            </p>

            <h1>Mi perfil</h1>

            <p>
                Consulta y actualiza tus datos personales.
            </p>

        </section>


        <section class="usuario-seccion">

            <form id="formPerfil">

                <div>

                    <label for="nombre">
                        Nombre
                    </label>

                    <input
                        type="text"
                        id="nombre"
                        required
                    >

                </div>


                <br>


                <div>

                    <label for="correo">
                        Correo electrónico
                    </label>

                    <input
                        type="email"
                        id="correo"
                        required
                    >

                </div>


                <br>


                <button type="submit">
                    Guardar cambios
                </button>

            </form>


            <p id="mensaje"></p>

        </section>

    </main>


    <script>

        const token = localStorage.getItem('token');

        // Comprobar si inició sesión
        if (!token) {

            window.location.replace('/login');

        }


        // Cargar perfil
        async function cargarPerfil() {

            try {

                const respuesta = await fetch(
                    '/api/usuario/perfil',
                    {
                        method: 'GET',

                        headers: {
                            'Authorization': `Bearer ${token}`
                        }
                    }
                );


                const datos = await respuesta.json();


                if (!respuesta.ok) {

                    localStorage.removeItem('token');
                    localStorage.removeItem('usuario');

                    window.location.replace('/login');

                    return;

                }


                document.getElementById('nombre').value =
                    datos.usuario.nombre;

                document.getElementById('correo').value =
                    datos.usuario.correo;


            } catch (error) {

                console.error(error);

                document.getElementById('mensaje').textContent =
                    'No se pudo cargar el perfil.';

            }

        }


        // Actualizar perfil
        document.getElementById('formPerfil')
            .addEventListener('submit', async (event) => {

                event.preventDefault();


                const nombre =
                    document.getElementById('nombre').value;

                const correo =
                    document.getElementById('correo').value;


                try {

                    const respuesta = await fetch(
                        '/api/usuario/perfil',
                        {
                            method: 'PUT',

                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': `Bearer ${token}`
                            },

                            body: JSON.stringify({
                                nombre,
                                correo
                            })
                        }
                    );


                    const datos = await respuesta.json();


                    document.getElementById('mensaje')
                        .textContent = datos.mensaje;


                    if (respuesta.ok) {

                        localStorage.setItem(
                            'usuario',
                            JSON.stringify(datos.usuario)
                        );

                    }


                } catch (error) {

                    console.error(error);

                    document.getElementById('mensaje').textContent =
                        'No se pudo actualizar el perfil.';

                }

            });


        // Cerrar sesión
        document.getElementById('cerrarSesion')
            .addEventListener('click', () => {

                localStorage.removeItem('token');
                localStorage.removeItem('usuario');

            });


        // Ejecutar al abrir la página
        cargarPerfil();

    </script>

</body>

</html>
